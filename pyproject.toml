[project]
name = "sqlarec"
version = "0.1.2"
description = "A context-aware Active Record API for synchronous SQLAlchemy 2."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Hamza Senhaji Rhazi" },
]
keywords = ["active-record", "orm", "sqlalchemy", "sql"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "sqlalchemy>=2.0,<3",
]

[project.urls]
Homepage = "https://github.com/Senhaji-Rhazi-Hamza/sqlarec"
Issues = "https://github.com/Senhaji-Rhazi-Hamza/sqlarec/issues"
Repository = "https://github.com/Senhaji-Rhazi-Hamza/sqlarec"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sqlarec"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["sqlarec"]
mypy_path = "src"
plugins = ["sqlalchemy.ext.mypy.plugin"]
