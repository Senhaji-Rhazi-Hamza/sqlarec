[project]
name = "sqlarec"
version = "0.2.2"
description = "Context-aware sync and async Active Record APIs for SQLAlchemy 2."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Hamza Senhaji Rhazi" },
]
keywords = ["active-record", "orm", "sqlalchemy", "sql"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "sqlalchemy[asyncio]>=2.0,<3",
]

[project.urls]
Homepage = "https://github.com/Senhaji-Rhazi-Hamza/sqlarec"
Issues = "https://github.com/Senhaji-Rhazi-Hamza/sqlarec/issues"
Repository = "https://github.com/Senhaji-Rhazi-Hamza/sqlarec"

[dependency-groups]
dev = [
    "aiosqlite>=0.20",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "ty",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sqlarec"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ty.src]
include = ["src", "tests"]
